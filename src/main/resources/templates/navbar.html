<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/global.css}"/>
  <style>

    body { margin: 0; display: flex; flex-direction: column; height: 100vh; }

    .top-bar {
      height: 70px;
      background-color: #4a5e3a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
    }

    .page-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
  width: 64px;
  background-color: #4a5e3a;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  padding: 16px 0;
  transition: width 0.3s ease;
  overflow-y: auto;
  overflow-x: hidden;
  flex-shrink: 0;

  scrollbar-width: none;
  -ms-overflow-style: none;
}

.sidebar::-webkit-scrollbar {
  display: none;
}

    .sidebar:hover { width: 218px; }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 10px 12px;
      text-decoration: none;
      cursor: pointer;
    }

    .nav-icon-wrap {
      width: 40px;
      height: 40px;
      background: rgba(210, 197, 155, 0.55);
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .nav-item:hover .nav-icon-wrap { background: rgba(210, 197, 155, 0.85); }

    .nav-icon-wrap i { font-size: 20px; color: #4a3320; }

    .nav-label {
      color: rgba(235, 222, 185, 0.9);
      font-size: 0.95rem;
      font-weight: 500;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .sidebar:hover .nav-label { opacity: 1; }

    .logo-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(210, 197, 155, 0.85);
      border: 1.5px solid rgba(160, 140, 90, 0.5);
      border-radius: 999px;
      padding: 7px 18px;
      text-decoration: none;
    }

    .logo-pill span { font-size: 15px; font-weight: 500; color: #5a4e38; }
    .logo-pill i { font-size: 18px; color: #5a4e38; }

    .user-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(210, 197, 155, 0.75);
      border: 1.5px solid rgba(160, 140, 90, 0.4);
      border-radius: 999px;
      padding: 6px 16px 6px 8px;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(90, 78, 56, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .user-avatar i { font-size: 20px; color: #4a3320; }
    .user-name { font-size: 0.9rem; font-weight: 500; color: #4a3320; }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 32px;
      background: #ffffff;
    }
    
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="#" class="logo-pill">
      <i class="bi bi-mortarboard-fill"></i>
      <span>UniMS</span>
    </a>
    <a href="/account-settings" style="text-decoration: none;">
    <div class="user-pill">
      <div class="user-avatar">
        <i class="bi bi-person-fill"></i>
      </div>
      <span class="user-name">Admin User</span>
    </div>
    </a>
  </div>

  <div class="page-body">

    <nav class="sidebar">
      <a href="/users" class="nav-item">
        <div class="nav-icon-wrap"><i class="bi bi-people-fill"></i></div>
        <span class="nav-label">User Management</span>
      </a>
      <a href="/departments" class="nav-item">
    <div class="nav-icon-wrap"><i class="bi bi-building-fill"></i></div>
    <span class="nav-label">Departments</span>
  </a>
      <a href="/courses" class="nav-item">
        <div class="nav-icon-wrap"><i class="bi bi-book-fill"></i></div>
        <span class="nav-label">Courses</span>
      </a>
      <a href="/groups" class="nav-item">
        <div class="nav-icon-wrap"><i class="bi bi-collection-fill"></i></div>
        <span class="nav-label">Groups</span>
      </a>
      <a href="/lessons" class="nav-item">
        <div class="nav-icon-wrap"><i class="bi bi-calendar-event-fill"></i></div>
        <span class="nav-label">Lessons</span>
      </a>
      <a href="/schedules" class="nav-item">
        <div class="nav-icon-wrap"><i class="bi bi-calendar3"></i></div>
        <span class="nav-label">Schedules</span>
      </a>
      
      <a href="/grades" class="nav-item">
        <div class="nav-icon-wrap"><i class="bi bi-star-fill"></i></div>
        <span class="nav-label">Grades</span>
      </a>
      <a href="/messages" class="nav-item">
    <div class="nav-icon-wrap"><i class="bi bi-chat-left-text-fill"></i></div>
    <span class="nav-label">Messages</span>
  </a>
      <a href="/classrooms" class="nav-item">
        <div class="nav-icon-wrap"><i class="bi bi-easel-fill"></i></div>
        <span class="nav-label">Classrooms</span>
      </a>
      <a href="/students" class="nav-item">
        <div class="nav-icon-wrap"><i class="bi bi-person-badge-fill"></i></div>
        <span class="nav-label">Students</span>
      </a>
      <a href="/teachers" class="nav-item">
        <div class="nav-icon-wrap"><i class="bi bi-person-workspace"></i></div>
        <span class="nav-label">Teachers</span>
      </a>
    </nav>

    <main class="main-content" layout:fragment="content"></main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
