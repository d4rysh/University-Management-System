<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{navbar}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Groups — UniMS</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}"/>
  <link rel="stylesheet" th:href="@{/css/global.css}"/>
  <style>
    body {   margin: 0;
  display: flex;
  flex-direction: column;
  height: 100vh;
  background: #f5f0e8;
  }

    .main-content { flex: 1; overflow-y: auto; padding: 32px; }

    .page-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #4a3f2e;
      margin-bottom: 24px;
    }

    .search-wrap {
      background: #fff;
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 24px;
      box-shadow: 0 2px 10px rgba(90, 78, 56, 0.07);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .search-wrap .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .search-wrap label {
      font-size: 0.8rem;
      color: #7a6a50;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .search-wrap .form-control {
      border-radius: 999px;
      border: 1.5px solid #d8c99a;
      padding: 8px 18px;
      font-size: 0.92rem;
      color: #4a3f2e;
      background: #fdf7ee;
      width: 220px;
    }

    .search-wrap .form-control:focus {
      border-color: #7a6a50;
      box-shadow: 0 0 0 2px rgba(140, 120, 70, 0.15);
      outline: none;
      background: #fff;
    }

    .search-wrap .form-control::placeholder {
      color: #c9c9c9;
    }

    .btn-search {
      background-color: #4a5e3a;
      color: #e8d9b0;
      border: none;
      border-radius: 999px;
      padding: 9px 24px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-search:hover { background-color: #3a4e2e; }

    .btn-reset {
      background: transparent;
      border: 1.5px solid #c8b98a;
      border-radius: 999px;
      padding: 9px 20px;
      font-size: 0.92rem;
      color: #7a6a50;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-reset:hover { background: #f0e8d8; }

    .table-wrap {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 10px rgba(90, 78, 56, 0.07);
    }

    .table-wrap table { margin: 0; }

    .table-wrap thead tr {
      background-color: #4a5e3a;
    }

    .table-wrap thead th {
      color: #e8d9b0;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 14px 20px;
      border: none;
    }

    .table-wrap tbody td {
      padding: 13px 20px;
      color: #4a3f2e;
      font-size: 0.92rem;
      vertical-align: middle;
      border-color: #f0e8d8;
    }

    .table-wrap tbody tr:hover { background-color: #fdf7ee; }

    .badge-id {
      background: #e8d9b0;
      color: #5a4e38;
      border-radius: 999px;
      padding: 3px 12px;
      font-size: 0.82rem;
      font-weight: 700;
    }
    
    .btn-delete {
  background: transparent;
  border: none;
  color: #b85c5c;
  font-size: 1.05rem;
  padding: 4px 8px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}

.btn-delete:hover {
  background: #fbeaea;
  color: #8a3a3a;
}

.view-details summary {
  list-style: none;
  cursor: pointer;
}

.view-details summary::-webkit-details-marker {
  display: none;
}

.btn-view {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1.5px solid #4a5e3a;
  color: #4a5e3a;
  font-size: 0.85rem;
  padding: 5px 14px;
  border-radius: 999px;
  transition: background 0.2s, color 0.2s;
  width: fit-content;
}

.btn-view:hover { background: #4a5e3a; color: #fff; }

.students-list {
  list-style: none;
  font-size: 0.88rem;
  color: #4a3f2e;
  margin-top: 8px;
  padding-left: 0 !important;
}

.btn-delete-student{
    background:none;
    border:none;
    color:#b85c5c;
    cursor:pointer;
    padding:2px 6px;
    border-radius:6px;
    transition:.2s;
}

.btn-delete-student:hover{
    background:#fbeaea;
    color:#8a3a3a;
}

.btn-add-student{
    border:none;
    background:#4a5e3a;
    color:white;
    padding:6px 16px;
    border-radius:999px;
    font-size:.85rem;
}

.btn-add-student:hover{
    background:#38492d;
}

.table-wrap tbody td:nth-child(3) { vertical-align: top; }

    .desc-cell {
      color: #7a6a50;
      font-size: 0.88rem;
      max-width: 280px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-row td {
      text-align: center;
      color: #9a8a6a;
      padding: 40px;
      font-size: 0.95rem;
    }

    .results-count {
      font-size: 0.85rem;
      color: #9a8a6a;
      margin-bottom: 12px;
      padding-left: 4px;
    }
     
  </style>
</head>
<body>

<div layout:fragment="content">

  <main class="main-content">
    <div class="page-title">Groups</div>
<div class="modal-backdrop fade show" th:if="${openGroupId != null}"></div>
<div th:if="${error}" class="alert alert-danger d-flex align-items-center gap-2" role="alert">
  <i class="bi bi-exclamation-triangle-fill"></i>
  <span th:text="${error}"></span>
</div>

<div th:if="${success}" class="alert alert-success d-flex align-items-center gap-2" role="alert">
  <i class="bi bi-check-circle-fill"></i>
  <span th:text="${success}"></span>
</div>

    <div class="row g-4">

      <!-- LEFT: TABLE -->
      <div class="col-md-8">

        <form class="search-wrap" th:action="@{/groups/search}" method="get">
          <div class="form-group">
            <label>Group name</label>
            <input type="text"
                   name="groupName"
                   class="form-control"
                   placeholder="e.g. AB-01"
                   th:value="${search}"/>
          </div>
          <button type="submit" class="btn-search">
            <i class="bi bi-search"></i> Search
          </button>
          <a th:href="@{/groups}" class="btn-reset">Reset</a>
        </form>

        <div class="results-count"
             th:text="${#lists.size(groups)} + ' group(s) found'"></div>

        <div class="table-wrap">
          <table class="table table-hover mb-0">
            <thead>
  <tr>
    <th>ID</th>
    <th>Group Name</th>
    <th></th> <!-- view / students column -->
    <th></th> <!-- delete column -->
  </tr>
</thead>
            <tbody>
  <tr th:each="group : ${groups}">
    <td><span class="badge-id" th:text="${group.groupId}"></span></td>
    <td th:text="${group.groupName}"></td>

    <td>
      <details class="view-details">
        <summary class="btn-view">
          <i class="bi bi-eye-fill"></i> View
        </summary>
        <ul class="students-list mb-0">
          <li th:each="student : ${group.students}"
    class="d-flex justify-content-between align-items-center">

    <span
        th:text="${student.userId + ' ' + student.firstName + ' ' + student.lastName}">
    </span>

<form th:action="@{/groups/{groupId}/remove-student/{userId}
        (groupId=${group.groupId}, userId=${student.userId})}"
      method="post"
      onsubmit="return confirm('Remove this student from the group?');">

    <button type="submit"
            class="btn-delete-student"
            title="Remove student">
        <i class="bi bi-trash3-fill"></i>
    </button>

</form>
</li>
          <li th:if="${#lists.isEmpty(group.students)}" class="text-muted">
            No students in this group.
          </li>
        </ul>
        <hr>

<div class="text-center mt-2">

    <button class="btn-add-student"
        data-bs-toggle="modal"
        th:data-bs-target="'#studentModal-' + ${group.groupId}">
    <i class="bi bi-plus-lg"></i>
    Add student
</button>


</div>
      </details>
      <div class="modal fade"
     th:id="'studentModal-' + ${group.groupId}"
     th:classappend="${openGroupId != null and openGroupId == group.groupId} ? 'show' : ''"
     th:style="${openGroupId != null and openGroupId == group.groupId} ? 'display:block;' : ''"
     tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">
          Add student to <span th:text="${group.groupName}"></span>
        </h5>
        <a th:href="@{/groups(pageNumber=${currentPage})}" class="btn-close"></a>
      </div>

      <div class="modal-body">

        <form th:action="@{/groups/{groupId}/search-available-students(groupId=${group.groupId})}"
              method="get" class="d-flex gap-2 mb-3">
          <input type="hidden" name="pageNumber" th:value="${currentPage}"/>
          <input type="text" name="lastName" class="form-control"
                 placeholder="Search by last name..."
                 th:value="${openGroupId != null and openGroupId == group.groupId} ? ${lastNameSearch} : ''"/>
          <button type="submit" class="btn-search">
            <i class="bi bi-search"></i>
          </button>
        </form>

        <ul class="students-list mb-0">
          <li th:each="student : ${availableStudents}"
              class="d-flex justify-content-between align-items-center">

            <span th:text="${student.userId + ' ' + student.firstName + ' ' + student.lastName}"></span>

            <form th:action="@{/groups/{groupId}/add-student/{userId}(groupId=${group.groupId}, userId=${student.userId})}"
                  method="post">
              <button type="submit" class="btn-add-student" title="Add to group">
                <i class="bi bi-plus-lg"></i>
              </button>
            </form>

          </li>
          <li th:if="${#lists.isEmpty(availableStudents)}" class="text-muted">
            No students found.
          </li>
        </ul>

      </div>
    </div>
  </div>
</div>
    </td>

    <td>
      <form th:action="@{/groups/delete-group/{groupId}(groupId=${group.groupId})}" method="post"
            onsubmit="return confirm('Delete this group? This cannot be undone.');">
        <button type="submit" class="btn-delete" title="Delete group">
          <i class="bi bi-trash3-fill"></i>
        </button>
      </form>
    </td>
  </tr>

  <tr class="empty-row" th:if="${#lists.isEmpty(groups)}">
    <td colspan="4">
      <i class="bi bi-emoji-frown"></i> No groups found.
    </td>
  </tr>
</tbody>
          </table>
        </div>

      </div>

      <!-- RIGHT: CREATE FORM -->
      <div class="col-md-4">

        <div class="card shadow-sm p-3" style="border-radius: 16px;">

          <h5 class="mb-3">Create Group</h5>

          <form th:action="@{/groups}" method="post">

            <div class="mb-3">
              <label class="form-label">Group name</label>
      <input type="text" name="groupName" class="form-control" required
             oninvalid="this.setCustomValidity('Please enter a group name')"
             oninput="this.setCustomValidity('')">
            </div>

            <button type="submit" class="btn btn-success w-100">
              Create
            </button>

          </form>

        </div>

      </div>

    </div>
  </main>

</div>

  <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
